# 有意在 Django 新增的接口（须 reason + tracking）；默认应为空
approved_python_exceptions:
  - route: "task2app/Saas_project/saas_project/urls.py::api/internal/feature-params/"
    reason: >
      feature-params store 表已迁 task_cloud.db（Cloud 本地 SQL）；
      Django internal 仍保留 resolve-owner-user / budget-permissions / company-creator，
      以及 store 路径的 410 stub（兼容旧调用方）。
    tracking: docs/superpowers/specs/2026-07-20-feature-params-store-and-env-preview-design.md
  - route: "task2app/Saas_project/projects/urls_feature_params_internal.py::"
    reason: >
      同上 — feature-params internal 子路由（含 410 stub 与仍活跃的 resolve/budget）。
    tracking: docs/superpowers/specs/2026-07-20-feature-params-store-and-env-preview-design.md
  - route: "task2app/Saas_project/projects/feature_params_internal_upsert_views.py::"
    reason: >
      store upsert/list/audit 410 stub 模块（表 SSOT 在 task_cloud.db）。
    tracking: docs/superpowers/specs/2026-07-20-feature-params-store-and-env-preview-design.md
  - route: "task2app/Saas_project/saas_project/urls.py::api/internal/session/"
    reason: >
      django_session 表 owner 为 saas-backend；
      task-auth 整改跨库直连时需要 SessionStore resolve internal API。
      符合 go_service_first「Django 作为已声明 internal 真源」例外。
    tracking: docs/architecture/table-to-owner.md#known-debt
  - route: "task2app/Saas_project/accounts/urls_session_internal.py::resolve/"
    reason: >
      同上 — session resolve 子路由（带尾斜杠）。
    tracking: docs/architecture/table-to-owner.md#known-debt
  - route: "task2app/Saas_project/accounts/urls_session_internal.py::resolve"
    reason: >
      同上 — session resolve 子路由（无尾斜杠兼容）。
    tracking: docs/architecture/table-to-owner.md#known-debt

  - route: "task2app/Saas_project/frontend_app/urls.py::api/system-admin/refund-policy/"
    reason: >
      Django superuser gate thin proxy to taskBill refund-policy;
      business logic SSOT in taskBill.
    tracking: docs/superpowers/specs/2026-07-22-tenant-refund-application-design.md
  - route: "task2app/Saas_project/frontend_app/urls.py::api/system-admin/refund-applications/"
    reason: >
      Django superuser gate thin proxy to taskBill internal refund APIs;
      business logic SSOT in taskBill (refund_handlers.go).
    tracking: docs/superpowers/specs/2026-07-22-tenant-refund-application-design.md
  - route: "task2app/Saas_project/frontend_app/urls.py::api/system-admin/refund-applications/<str:application_id>/approve/"
    reason: >
      Django superuser gate thin proxy to taskBill approve refund application;
      business logic SSOT in taskBill.
    tracking: docs/superpowers/specs/2026-07-22-tenant-refund-application-design.md
  - route: "task2app/Saas_project/frontend_app/urls.py::api/system-admin/refund-applications/<str:application_id>/reject/"
