version: "1"

# 接口 / 路由前缀 → 目标服务（机器可读 SSOT）
# 规范：.ai/01_project_constraints/20_go_service_first_apis.md
# 人读摘要：docs/architecture/api-route-to-owner.md
# 存量 Django 公网 API 迁出节奏（本规则管新增，不强制一次迁完）：
#   docs/superpowers/specs/2026-07-05-task2app-api-go-split-brainstorm-design.md
#
# 约定：
# - django_baseline_routes：当前 Django urls.py 中 path/re_path/url 字面量冻结清单（file::pattern）
# - 新增 Django 路由 = 出现在扫描结果但不在 baseline、且不在 approved_python_exceptions → CI 失败
# - 迁出后删除 Django 路由时，应同步从 baseline 剔除（CI 对 stale baseline 仅 WARN）
# - route_prefixes：目标 owner 与状态（文档 + 失败时提示）；以限界上下文为准，可渐进补全
# - status: go | django-legacy | django-internal | migrate-to-go | python-exception

policy:
  scope: new_django_routes
  default_for_new_apis: go
  legacy_migration_doc: docs/superpowers/specs/2026-07-05-task2app-api-go-split-brainstorm-design.md
  notes: |
    元规则约束新增服务/接口默认落 Go（扩展现有或新建）。
    存量 Django 公网 API 按 legacy_migration_doc 的优先级与 Phase 节奏迁出，不要求一次性迁完。

django_url_scan_roots:
  - path: task2app/Saas_project
    process: saas-backend
  - path: taskAiProvider
    process: ai-provider
    note: Go taskAiProvider（原 Django Saas_Ai_Provider）
scan_exclude_globs:
  - "**/migrations/**"
  - "**/tests/**"
  - "**/test_*.py"
  - "**/*_test.py"

