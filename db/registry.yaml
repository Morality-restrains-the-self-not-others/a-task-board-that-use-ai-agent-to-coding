version: "2"

# Shared MySQL connection parameters.
# mysql.password stays empty in git. Overlay conf-local/db/registry.yaml or MYSQL_PASSWORD.
mysql:
  host: 127.0.0.1
  port: 3306
  user: taskapp
  password: ""

# 路径均相对 monorepo 根（conf/base.yaml 锚点；OPT-20260806-057: django 目录退役）
databases:
  task-auth:
    driver: mysql
    database: task_auth
    path: db/task-auth/auth.sqlite3      # legacy SQLite（MySQL 迁移后仅用于清理）
    owner: task-auth
    order: 9
    migrate_script: db/task-auth/migrate.sh
    init_script: db/task-auth/init.sh
    description: taskAuth Go + Django router 只读库

  task-bill:
    driver: mysql
    database: task_bill
    path: db/task-bill/billing.sqlite3   # legacy SQLite（MySQL 迁移后仅用于清理）
    owner: task-bill
    order: 20
    migrate_script: db/task-bill/migrate.sh
    init_script: db/task-bill/init.sh
    description: taskBill Go 计费库

  git-oauth:
    driver: mysql
    database: git_oauth
    path: db/git-oauth/git-oauth.sqlite3 # legacy SQLite（MySQL 迁移后仅用于清理）
    owner: git-oauth
    order: 30
    migrate_script: db/git-oauth/migrate.sh
