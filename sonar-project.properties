# SonarQube 9.9 analysis parameters
# https://docs.sonarsource.com/sonarqube-server/9.9/analyzing-source-code/analysis-parameters/
#
# sonar.exclusions only skip files AFTER the directory walk. dockerInfra/mysql/data
# contains 750 dirs the scanner cannot open (AccessDeniedException), so it must
# not be listed in sonar.sources.
sonar.projectKey=ram-work
sonar.projectName=ram-work
sonar.sourceEncoding=UTF-8
sonar.sources=\
  AiMonitor,\
  conf,\
  dataMigrate,\
  db,\
  gitService/domain,\
  gitService/scripts,\
  gitService/initializers,\
  go_relayToTrae,\
  mock_run_container,\
  runAll,\
  scripts,\
  shareLib,\
  taskAIComment,\
  taskAIEndPoint,\
  taskAgentSupport,\
  taskAiProvider,\
  taskAuth,\
  taskBill,\
  taskChromePlugin,\
  taskCloudService,\
  taskContainerGateway,\
  taskCredentialService,\
  taskEvents,\
  taskFE,\
  taskGateway,\
  taskGitOauth,\
  taskProjectService,\
  taskReferral,\
  taskSSE,\
  taskTaskService,\
  taskTenantService,\
  trae-agent,\
  valueStream
sonar.exclusions=\
  **/node_modules/**,\
  runAll/src/status_ui/**,\
  **/.git/**,\
  **/vendor/**,\
  **/bin/**,\
  **/.scannerwork/**,\
  **/coverage/**,\
  **/dist/**,\
  **/__pycache__/**,\
  **/.venv/**,\
  **/third_party/**,\
  **/*.tar.gz,\
  **/*.min.js,\
  **/*.sqlite3*,\
  **/tailwind.output.css,\
  **/*.local.yaml,\
  **/config.local.yaml,\
  **/playwright-report/**,\
  **/test-results/**,\
  **/tests/manual/**,\
  **/public/releases/**
# Coverage reports are generated into .runall/sonar-coverage/ (gitignored runtime
# state); the sonarqube.sh docker mount makes them visible to the scanner
# relative to projectBaseDir. Go uses `go test -coverprofile` .out; Python is
# pytest-cov cobertura XML; JS is lcov (c8 / vitest).
sonar.go.coverage.reportPaths=\
  .runall/sonar-coverage/go_relayToTrae.out,\
  .runall/sonar-coverage/runAll.out,\
  .runall/sonar-coverage/shareLib.out,\
  .runall/sonar-coverage/taskAIComment.out,\
  .runall/sonar-coverage/taskAIEndPoint.out,\
  .runall/sonar-coverage/taskAgentSupport.out,\
  .runall/sonar-coverage/taskAiProvider.out,\
  .runall/sonar-coverage/taskAuth.out,\
  .runall/sonar-coverage/taskBill.out,\
  .runall/sonar-coverage/taskCloudService.out,\
  .runall/sonar-coverage/taskContainerGateway.out,\
  .runall/sonar-coverage/taskCredentialService.out,\
  .runall/sonar-coverage/taskEvents.out,\
  .runall/sonar-coverage/taskGateway.out,\
  .runall/sonar-coverage/taskGitOauth.out,\
  .runall/sonar-coverage/taskProjectService.out,\
  .runall/sonar-coverage/taskReferral.out,\
  .runall/sonar-coverage/taskTaskService.out,\
  .runall/sonar-coverage/taskTenantService.out
sonar.python.coverage.reportPaths=.runall/sonar-coverage/python-coverage.xml
sonar.javascript.lcov.reportPaths=.runall/sonar-coverage/onlineServiceJS/lcov.info
sonar.python.version=3.11
# Nested git submodules make blame/line-count disagree with file content (CE FAIL).
sonar.scm.disabled=true
