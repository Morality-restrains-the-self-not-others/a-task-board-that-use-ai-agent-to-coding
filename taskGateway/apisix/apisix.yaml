routes:
- id: gateway-docs-portal
  priority: 2101
  uris:
  - /gateway/docs/
  - /gateway/docs
  upstream_id: up-docsPortal
  plugins:
    cors:
      allow_origins: http://127.0.0.1:4000,http://localhost:4000,https://www.daydaymoney.com,https://daydaymoney.com,http://127.0.0.1:3000,http://localhost:3000,http://10.2.150.68:3000
      allow_methods: GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD
      allow_headers: Authorization,Content-Type,X-Trace-Id,X-Span-Id,X-Parent-Span-Id,traceparent,X-CSRFToken,X-Requested-With,Idempotency-Key
      expose_headers: X-Trace-Id,X-Parent-Span-Id,traceparent
      allow_credential: true
      max_age: 3600
    serverless-pre-function:
      phase: rewrite
      functions:
      - "return function(conf, ctx)\n    local core = require(\"apisix.core\")\n \
        \   local resty_random = require(\"resty.random\")\n    local str = require(\"\
        resty.string\")\n    local trace_id = core.request.header(ctx, \"X-Trace-Id\"\
        )\n    if not trace_id or trace_id == \"\" then\n        -- Auto-generate\
        \ traceId so error responses (404, 500, etc.)\n        -- always carry a traceable\
        \ ID for diagnostics.\n        trace_id = str.to_hex(resty_random.bytes(16))\n\
        \        core.request.set_header(ctx, \"X-Trace-Id\", trace_id)\n    end\n\
        \    -- Set response header so the client always receives X-Trace-Id,\n  \
        \  -- even for APISIX-generated error responses (404 route-not-found, etc.).\n\
        \    core.response.set_header(\"X-Trace-Id\", trace_id)\n    if not core.request.header(ctx,\
        \ \"X-Parent-Span-Id\") and not core.request.header(ctx, \"traceparent\")\
        \ then\n        local span = str.to_hex(resty_random.bytes(8))\n        core.request.set_header(ctx,\
        \ \"X-Parent-Span-Id\", span)\n    end\nend"
