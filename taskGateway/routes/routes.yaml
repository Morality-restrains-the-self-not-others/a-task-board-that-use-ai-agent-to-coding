    upstream: taskTenantService
    auth_mode: token

  # 容器 inbound：access_token 在 JSON body，不走浏览器 JWT forward-auth。
  # 44efa06 约定迁移误删本路由且 /api/container/* 替换路由从未落地 → 容器
  # exchange-refresh/register-reachability 全部 401「无法解析登录凭据」→ TOKEN_BOOTSTRAP_FAILED
  # fail-closed 卡 pending（OPT-20260809-024 修复）；taskAgentSupport 按 action 分发
  # 令牌动作→taskCredentialService(:8015)、回调动作→taskCloudService(:8018)。
  - id: container-inbound-token
    priority: 895
    uris:
      - /api/tenant/*/workspace/*/task/*/comment/*/cloud/server-container-token/*
      - /api/tenant/*/workspace/*/task/*/comment/*/cloud/server-container-token
      - /api/tenant/*/workspace/*/task/*/comment/*/cloud/model-budget-usage*
      - /api/tenant/*/workspace/*/task/*/comment/*/cloud/model-budget-usage
      - /api/tenant/*/workspace/*/task/*/comment/*/cloud/relay-to-trae/status-push*
      - /api/tenant/*/workspace/*/task/*/comment/*/cloud/relay-to-trae/status-push
    upstream: taskAgentSupport
    auth_mode: machine

  # onioning 公司创建 / 其他 accounts 端点仍在 Django；低于 task-tenant-service 避免拦截 members/groups
  # OPT-049: Django saas-backend decommissioned (2026-07-30) — route disabled

  # onioning 公司创建 / 其他 accounts 端点仍在 Django；低于 task-tenant-service 避免拦截 members/groups
#   - id: django-tenant-accounts
#     priority: 856
#     uris:
#       - /api/tenant/*/accounts/*
#     upstream: django
#     auth_mode: token

  - id: task-task-service
    priority: 862
    uris:
      - /api/tasks/*
      - /api/git-identities/*
      - /api/tenant_id/*/workspaceId/*/tasks/*/comments/*
    upstream: taskTaskService
    auth_mode: token

  - id: task-ai-comment
    priority: 861
    uris:
      - /api/ai-comment/*
    upstream: taskAIComment
    auth_mode: token

  - id: task-cloud-service
    priority: 868
    uris:
      - /api/cloud/*
      - /callback/cloudplatform/oauth2.0/aliyun
    upstream: taskCloudService
    auth_mode: token

  # UserData 首启验证回调：secret 在 URL（GET，ECS 上 userdata 脚本直接 curl），
  # 无浏览器 JWT → 必须 machine 模式且优先于 task-cloud-service(868) 的 forward-auth。
  # 44efa06 约定迁移误删本路由（legacy 形态）；现恢复为 /api/cloud/ 约定形态
  # （kv-last scope，OPT-20260809-024 同批），与 taskCloudService 仅挂约定路径一致。
  - id: server-userdata-verify
    priority: 894
    uris:
      - /api/cloud/server-userdata-verify/*
    upstream: taskCloudService
    auth_mode: machine

  # [DEPRECATED v55] django-default — 被下方 spa-catch-all 替代（priority 10, /* [GET,HEAD] → taskFE）
  # - id: django-default
  #   priority: 0
  #   uri: /*
  #   upstream: django
  #   auth_mode: token

  # OPT-049: Orphaned API routes (formerly Django) — return immediate 502 instead of
  # falling through to spa-catch-all which would hang (Vue dev server timeout).
  - id: api-orphaned-not-found
    priority: 15
    uri: /api/*
    upstream: null-upstream
    auth_mode: public

  # SPA shell catch-all — 所有非 API GET/HEAD 请求 → taskFE（Vue Router 处理客户端路由与认证）
  # ⚠️ 禁止绑定 hosts（2026-08-09 修复回归，回归点 8f6194c 08-03）：hosts 绑定
  # [daydaymoney.com, www.daydaymoney.com] 会劫持该域名下全部 GET/HEAD——包括 /api/* ——
  # priority 10 的兜底路由在 host 匹配分支下压过 priority 850 的 taskauth-login，
  # 导致 www.daydaymoney.com/api/auth/wechat/login/ 被转发到 taskFE(4000) → 500/502。
  # 不绑 hosts 时由 priority 排序兜底：/api/* → api-orphaned(15)/业务路由，非 API → 本路由。
  - id: spa-catch-all
    priority: 10
    uri: /*
    methods: [GET, HEAD]
    upstream: taskFE
    auth_mode: public
