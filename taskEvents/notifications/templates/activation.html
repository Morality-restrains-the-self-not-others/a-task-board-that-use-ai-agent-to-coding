<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>账号激活 - SaaS平台</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #7241F2; color: white; padding: 10px 20px; border-radius: 5px 5px 0 0; }
        .content { background-color: #fff; padding: 20px; border: 1px solid #ddd; border-top: none; }
        .activation-link { display: inline-block; background-color: #7241F2; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; margin: 15px 0; }
        .expire-note { color: #666; font-size: 14px; }
        .footer { margin-top: 20px; color: #666; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>SaaS平台账号激活</h2>
        </div>
        <div class="content">
            <p>尊敬的用户：</p>
            <p>感谢您注册我们的SaaS平台！请点击以下按钮激活您的账号：</p>
            <p><a href="{{.ActivationURL}}" class="activation-link">激活我的账号</a></p>
            <p class="expire-note">该链接将在24小时后失效。</p>
            <p>如果点击按钮无效，请复制以下链接到浏览器地址栏：</p>
            <p>{{.ActivationURL}}</p>
            <p>如果您没有注册我们的平台，请忽略此邮件。</p>
            <p>祝好！</p>
            <p>SaaS平台团队</p>
        </div>
        <div class="footer">
            <p>这是一封自动发送的邮件，请勿回复。</p>
        </div>
    </div>
</body>
</html>
