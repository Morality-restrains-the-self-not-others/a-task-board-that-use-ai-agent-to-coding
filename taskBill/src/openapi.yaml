openapi: 3.0.3
info:
  title: taskBill API
  description: '计费服务公开 API（经 taskGateway / Django BillingProxy）。

    内部路径 `/api/internal/taskbill/*` 见 `openapi-internal.yaml` （`/api/swagger-internal/`
    或网关 `/gateway/ops/docs/taskBill/`）。'
  version: 1.2.0
servers:
- url: http://127.0.0.1:8004
  description: taskBill 直连（开发）
tags:
- name: meta
  description: 健康检查与文档
- name: billing
  description: 租户计费只读 / 套餐切换
- name: payment
  description: 用户充值（PayPal / 微信）与渠道开关
- name: webhook
  description: 第三方支付回调（公网直挂，无用户会话）
- name: legal
  description: 法律文档（服务协议 + 隐私条款）
- name: admin
  description: 管理后台接口（系统管理员）
- name: internal
  description: 服务间内部接口（须 Internal Secret）
paths:
  /api/health/:
    get:
      summary: 健康检查
      tags:
      - meta
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: taskBill
  /api/license-agreement/public/current/:
    get:
      summary: 获取当前生效的服务协议（公开，无需认证）
      description: '?kind=service（默认）或 ?kind=recharge_points'
      tags:
      - legal
      parameters:
      - name: kind
        in: query
        schema:
          type: string
          enum: [service, recharge_points]
      responses:
        '200':
          description: 当前生效协议
        '404':
          description: 无生效协议
  /api/license-agreement/consent/:
    post:
      summary: 登录用户对当前服务协议补录同意
      tags:
      - legal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                license_agreement_id:
                  type: string
                accepted_license_agreement_id:
                  type: string
      responses:
        '200':
          description: 同意已记录
        '400':
          description: 参数错误
        '401':
          description: 未登录
  /api/privacy-policy/public/current/:
    get:
      summary: 获取当前生效的隐私条款（公开，无需认证）
      tags:
      - legal
      responses:
        '200':
          description: 当前生效隐私条款
        '404':
          description: 无生效隐私条款
  /api/privacy-policy/consent/:
    post:
      summary: 登录用户对当前隐私条款补录同意
      tags:
      - legal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                privacy_policy_id:
                  type: string
                accepted_privacy_policy_id:
                  type: string
      responses:
        '200':
          description: 同意已记录
        '400':
          description: 参数错误
        '401':
          description: 未登录
  /api/system_admin/license-agreement/:
    get:
      summary: 管理端 — 服务协议列表
      tags:
      - admin
      parameters:
      - name: kind
        in: query
        schema:
          type: string
      responses:
        '200':
          description: 协议列表
    post:
      summary: 管理端 — 创建服务协议
      tags:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content, version]
              properties:
                title:
                  type: string
                content:
                  type: string
                version:
                  type: string
                document_kind:
                  type: string
                is_active:
                  type: boolean
                is_material_change:
                  type: boolean
      responses:
        '201':
          description: 已创建
        '400':
          description: 参数错误
  /api/system_admin/privacy-policy/:
    get:
      summary: 管理端 — 隐私条款列表
      tags:
      - admin
      responses:
        '200':
          description: 隐私条款列表
    post:
      summary: 管理端 — 创建隐私条款
      tags:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content, version]
              properties:
                title:
                  type: string
                content:
                  type: string
                version:
                  type: string
                is_active:
                  type: boolean
                is_material_change:
                  type: boolean
      responses:
        '201':
          description: 已创建
        '400':
          description: 参数错误
  /api/system-admin/resource-pricing/:
    get:
      summary: 管理端 — 读取资源定价
      tags:
      - admin
      responses:
        '200':
          description: 当前资源定价
    put:
      summary: 管理端 — 更新资源定价
      tags:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task_post_price_yuan:
                  type: number
                gitlab_disk_price_yuan:
                  type: number
                gitlab_traffic_price_yuan:
                  type: number
                gitlab_traffic_requires_unit_type:
                  type: string
      responses:
        '200':
          description: 更新成功
        '400':
          description: 参数错误
  /api/system-admin/user-recharge-consumption/:
    get:
      summary: 管理端 — 用户充值消费汇总
      tags:
      - admin
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: offset
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: 汇总列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
  /api/system-admin/refund-applications/:
    get:
      summary: 管理端 — 退款申请列表
      tags:
      - admin
      responses:
        '200':
          description: 申请列表
    parameters: []
  /api/system-admin/invoice-applications/:
    get:
      summary: 管理端 — 开票申请列表
      tags:
      - admin
      parameters:
      - name: status
        in: query
        schema:
          type: string
      - name: id
        in: query
        description: 申请 ID 等值过滤（OPT-20260823-045）
        schema:
          type: string
      - name: tenant_id
        in: query
        description: 租户 ID 等值过滤（OPT-20260823-045）
        schema:
          type: string
      - name: order_id
        in: query
        description: 订单 ID 等值过滤（OPT-20260823-045）
        schema:
          type: string
      - name: buyer_name
        in: query
        description: 抬头名称模糊过滤（OPT-20260823-045）
        schema:
          type: string
      responses:
        '200':
          description: 申请列表
  /api/system-admin/invoice-applications/{application_id}/approve/:
    post:
      summary: 管理端 — 批准开票并调用微信开具
      tags:
      - admin
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 已受理开具
        '400':
          description: 申请非待审批、发票号过长、或订单金额为 0
  /api/system-admin/invoice-applications/{application_id}/reject/:
    post:
      summary: 管理端 — 拒绝开票申请
      tags:
      - admin
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 已拒绝
  /api/billing/wechat/fapiao/notify/:
    post:
      summary: 微信电子发票回调
      tags:
      - webhook
      responses:
        '200':
          description: SUCCESS
  /api/system-admin/refund-policy/:
    get:
      summary: 管理端 — 获取退款申请开关
      tags:
      - admin
      responses:
        '200':
          description: 退款策略状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
    put:
      summary: 管理端 — 更新退款申请开关
      tags:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: 更新结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
  /api/system_admin/orders/:
    get:
      summary: 管理端 — 跨租户订单列表
      tags:
      - admin
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          maximum: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: 订单列表
  /api/system_admin/profit-sharing/:
    get:
      summary: 管理端 — 待分账订单队列（仅平台员工）
      tags:
      - admin
      parameters:
      - name: status
        in: query
        description: pending|processing|failed|finished|open（默认，未完成）|all
        schema:
          type: string
          default: open
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          maximum: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: 分账记录队列；不含 openid；含 out_trade_no（商户单号）/ out_profit_sharing_no（同一记录上的微信支付 out_order_no 幂等键，非独立实体）/ wechat_transaction_id / wechat_profit_sharing_id（可空）
        '400':
          description: 非法 status
        '401':
          description: 未认证
        '403':
          description: 非平台员工
  /api/system_admin/orders/{order_id}/comments/:
    get:
      summary: 管理端 — 订单评论列表
      tags:
      - admin
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      - name: tenant_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: 评论列表
    post:
      summary: 管理端 — 发表订单评论
      tags:
      - admin
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, content]
              properties:
                tenant_id:
                  type: string
                content:
                  type: string
      responses:
        '201':
          description: 评论已创建
  /api/system_admin/users/{uid}/recharges/:
    get:
      summary: 管理端 — 用户充值记录与协议同意
      tags:
      - admin
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
        description: 用户 ID
      responses:
        '200':
          description: 充值记录与协议同意
          content:
            application/json:
              schema:
                type: object
                properties:
                  recharges:
                    type: array
                  consents:
                    type: array
  /api/public/resource-pricing/:
    get:
      summary: 公开资源定价（无需认证）
      tags:
      - meta
      responses:
        '200':
          description: 当前资源单价
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  task_post_price:
                    type: integer
                  gitlab_disk_price:
                    type: integer
                  gitlab_traffic_price:
                    type: integer
                  pricing:
                    type: object
  /api/public/product-pricing/:
    get:
      summary: 公开产品定价（无需认证）
      description: 返回任务积分和 GitLab 资源单价（分为单位），前端除以 100 显示元。
      tags:
      - meta
      responses:
        '200':
          description: 当前产品定价
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  task_points:
                    type: integer
                  task_renewal_points_per_month:
                    type: integer
                    nullable: true
                  gitlab_disk_points_per_gb_per_month:
                    type: integer
                    nullable: true
                  gitlab_traffic_points_per_gb:
                    type: integer
                    nullable: true
  /api/tenant/{tenant_id}/billing/refund-applications/:
    get:
      summary: 租户退款申请列表
      tags:
      - billing
      parameters:
      - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: 申请列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/RefundApplication'
    post:
      summary: 提交退款申请（租户管理员）
      tags:
      - billing
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: Idempotency-Key
        in: header
        schema:
          type: string
      responses:
        '201':
          description: 已创建
  /api/tenant/{tenant_id}/billing/orders/{order_id}/invoice-applications/:
    post:
      summary: 提交开票申请（租户 billing:manage）
      tags:
      - billing
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [INDIVIDUAL, ORGANIZATION]
                name:
                  type: string
                taxpayer_id:
                  type: string
      responses:
        '201':
          description: 待审批申请
        '400':
          description: 抬头不完整、未支付、或订单金额为 0 无法开票
  /api/tenant/{tenant_id}/billing/orders/{order_id}/invoices/:
    get:
      summary: 订单下电子发票列表
      tags:
      - billing
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 发票列表
  /api/tenant/{tenant_id}/billing/orders/{order_id}/invoices/{invoice_id}/file/:
    get:
      summary: 下载订单发票挂载的手动开具发票文件（PDF/JPEG/PNG）
      tags:
      - billing
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      - name: invoice_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 发票文件内容（application/pdf / image/jpeg / image/png）
        '403':
          description: 无权限
        '404':
          description: 文件不存在
  /api/tenant/{tenant_id}/billing/accounts/balance/:
    get:
      summary: 租户积分余额
      tags:
      - billing
      parameters:
      - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: 账户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        '400':
          description: 租户无效
        '405':
          description: method not allowed
  /api/tenant/{tenant_id}/billing/gitlab-resources/:
    get:
      summary: 查询系统内建 GitLab 磁盘/流量配额与锁价
      tags:
      - billing
      parameters:
      - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: 当前配额与单价
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitlabResourcesView'
        '400':
          description: 租户无效
  /api/tenant/{tenant_id}/billing/gitlab-resources/purchase/:
    post:
      summary: 按当前锁价整单新购 GitLab 磁盘（含购买月数）与流量预购配额
      tags:
      - billing
      parameters:
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - disk_gb
              - traffic_prepaid_gb
              properties:
                disk_gb:
                  type: integer
                  format: int64
                  minimum: 0
                disk_months:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 36
                  description: 磁盘购买时长（月）。disk_gb>0 时缺省为 1；费用=GB×单价×月数
                traffic_prepaid_gb:
                  type: integer
                  format: int64
                  minimum: 0
                idempotency_key:
                  type: string
      responses:
        '200':
          description: 购买成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitlabResourcesPurchaseResult'
        '400':
          description: 参数错误
        '402':
          description: 余额不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientBalance'
  /api/tenant/{tenant_id}/billing/units/:
    get:
      summary: 列出计费单元
      tags:
      - billing
      parameters:
      - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: 计费单元列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BillingUnit'
  /api/tenant/{tenant_id}/billing/statistics/:
    get:
      summary: 租户积分消费/充值聚合统计
      tags:
      - billing
      parameters:
      - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: 聚合统计
        '400':
          description: 租户信息无效
        '405':
          description: method not allowed
  /api/tenant/{tenant_id}/billing/transactions/:
    get:
      summary: 交易流水（未筛选）
      description: '带 `page` 时返回分页体 `{results,total,page,page_size}`；

        不带 `page` 时返回数组（最多 5000，Dashboard 兼容）。

        每行附带可选 `change_display` / `resource_changes` / `ledger_snapshot`。

        '
      tags:
      - billing
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 流水数组或分页体
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/BillingTransaction'
                - $ref: '#/components/schemas/PagedTransactions'
  /api/tenant/{tenant_id}/billing/transactions/list_filtered/:
    get:
      summary: 筛选交易流水（含展示名 enrichment）
      description: '带 `page` 时返回分页体；不带 `page` 时返回数组（最多 5000）。

        `billing_unit` 为嵌套对象（含 name/unit/unit_type）。

        每行附带可选 `change_display` / `resource_changes` / `ledger_snapshot`（变动明细与瞬时账目）。

        '
      tags:
      - billing
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      - $ref: '#/components/parameters/ProjectId'
      - name: user_id
        in: query
        schema:
          type: string
      - name: workspace_id
        in: query
        schema:
          type: string
      - name: task_id
        in: query
        schema:
          type: string
      - name: transaction_type
        in: query
        schema:
          type: string
          enum:
          - recharge
          - consumption
          - refund
      - name: billing_unit_type
        in: query
        description: 消耗积分分类（计费单元类型）
        schema:
          type: string
      - name: points_source_type
        in: query
        description: 单个值或逗号分隔多值
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 流水数组或分页体
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/BillingTransaction'
                - $ref: '#/components/schemas/PagedTransactions'
  /api/tenant/{tenant_id}/billing/usages/:
    get:
      summary: 使用记录列表
      description: '带 `page` 时返回分页体；不带 `page` 时返回数组（最多 5000）。

        响应前经 Django enrich 补齐 user_name / project_name 等。

        '
      tags:
      - billing
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      - $ref: '#/components/parameters/ProjectId'
      - name: workspace_id
        in: query
        schema:
          type: string
      - name: billing_unit_type
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 使用记录或分页体
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/BillingUsage'
                - $ref: '#/components/schemas/PagedUsages'
  /api/billing/profitsharing/notify/:
    post:
      summary: 微信分账结果/动账通知（存量 URL）
      description: 与 change-notify 同一处理函数。商户后台请配置 change-notify。
      tags:
      - webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
