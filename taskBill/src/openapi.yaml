      - name: op_type
        in: query
        description: 操作类型（如 admin_grant）
        schema:
          type: string
      - name: tenant_id
        in: query
        schema:
          type: string
      - name: operator_user_id
        in: query
        schema:
          type: string
      - name: key
        in: query
        description: 幂等键前缀
        schema:
          type: string
      responses:
        '200':
          description: 幂等键记录列表（含 total/limit/offset/records）
        '403':
          description: 非平台员工

  /api/system-admin/idempotency-records/:
    get:
      summary: 管理端 — 幂等键审计记录（含 admin_grant 操作者与目标租户）
      tags:
      - admin
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          maximum: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      - name: op_type
        in: query
        description: 操作类型（如 admin_grant）
        schema:
          type: string
      - name: tenant_id
        in: query
        schema:
          type: string
      - name: operator_user_id
        in: query
        schema:
          type: string
      - name: key
        in: query
        description: 幂等键前缀
        schema:
          type: string
      responses:
        '200':
          description: 幂等键记录列表（含 total/limit/offset/records）
        '403':
          description: 非平台员工

  /api/system-admin/order-number/parse/:
    post:
      summary: 管理端 — 解析展示订单号（粘贴跳转）
      tags:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_number]
              properties:
                order_number:
                  type: string
                  description: ADR-0017/0018 展示订单号（四段含租户基因，三段无）
      responses:
        '200':
          description: 解析结果（四段号 has_tenant=true；三段号仅 order_id）
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_number:
                    type: string
                  has_tenant:
                    type: boolean
                  tenant_id:
                    type: string
                  order_id:
                    type: string
                  date_utc:
                    type: string
        '400':
          description: 订单号非法
        '401':
          description: 未认证
        '403':
          description: 非平台员工

  /api/system-admin/users/{uid}/recharges/:
    get:
      summary: 管理端 — 用户充值记录与协议同意
      tags:
      - admin
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
        description: 用户 ID
      responses:
        '200':
          description: 充值记录与协议同意
          content:
            application/json:
              schema:
                type: object
                properties:
                  recharges:
                    type: array
                  consents:
                    type: array

  /api/system-admin/gitlab-regions/:
    get:
      summary: 管理端 — GitLab 区域列表（含容量、带宽共享与部署路径）
      tags:
      - admin
      responses:
        '200':
          description: 区域列表（含 service_process/config_file/data_dir、infra_status、cloud_provider）
    post:
      summary: 管理端 — 新增 GitLab 区域
      tags:
      - admin
      responses:
        '200':
          description: 创建成功
    put:
      summary: 管理端 — 更新 GitLab 区域元数据
      tags:
      - admin
      responses:
        '200':
          description: 更新成功（PUT 可写 infra_status=ready|pending_node）
    delete:
      summary: 管理端 — 删除 GitLab 区域
      tags:
      - admin
      responses:
        '200':
          description: 删除成功

components:
  securitySchemes:
    internalSecret:
      type: apiKey
      in: header
      name: X-TaskBill-Internal-Secret
      description: 服务间共享密钥；未配置时开发环境放行
  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: string
      description: 资源订单 ID（snowflake）
    UserIdHeader:
      name: X-User-Id
      in: header
      required: true
      schema:
        type: string
      description: 网关鉴权注入的用户 ID
    StartDate:
      name: start_date
      in: query
      schema:
        type: string
        format: date
    EndDate:
      name: end_date
      in: query
      schema:
        type: string
        format: date
    ProjectId:
      name: project_id
      in: query
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
  schemas:
    BillingStatistics:
      type: object
      required:
      - month_start
      - total_consumption_points
      - monthly_consumption_points
      - user_recharge_points
      properties:
        month_start:
          type: string
          format: date
        total_consumption_points:
          type: integer
          format: int64
          description: 累计消耗（分）：用量扣费 + 仍有效（paid）的资源订单，不含已退款/已取消订单
        monthly_consumption_points:
          type: integer
          format: int64
          description: 本月消耗（分），口径同累计消耗，不含已退款/已取消订单
        user_recharge_points:
          type: integer
          format: int64
          description: 累计支付（分，净值）：钱包实付充值 + 资源订单实付 − 已完成退款，不含 admin_grant
        total_consumption_cents:
          type: integer
          format: int64
          description: 与 total_consumption_points 同值（分），兼容别名
        monthly_consumption_cents:
          type: integer
          format: int64
          description: 与 monthly_consumption_points 同值（分），兼容别名
        user_recharge_cents:
          type: integer
          format: int64
          description: 与 user_recharge_points 同值（分），兼容别名
    PagedTransactions:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BillingTransaction'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    PagedUsages:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BillingUsage'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    BillingAccount:
      type: object
      properties:
        id:
          type: string
        tenant:
          type: string
        points:
          type: integer
          format: int64
        available_balance:
          type: integer
          format: int64
        frozen_balance:
          type: integer
          format: int64
        lots:
          type: array
          description: 未过期且 remaining_points>0 的信用批次
          items:
            $ref: '#/components/schemas/CreditLot'
        created_at:
          type: string
        updated_at:
          type: string
    CreditLot:
      type: object
      properties:
        id:
          type: string
        points:
          type: integer
          format: int64
        remaining_points:
          type: integer
          description: 金额，单位：分（1 元 = 100）
          format: int64
        expires_at:
          type: string
        channel:
          type: string
    RefundApplication:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        account_id:
          type: string
        applicant_user_id:
          type: string
        frozen_points:
          type: integer
          format: int64
          description: 退款申请冻结金额，单位：分（1 元 = 100），勿直接把分当元展示
        frozen_yuan:
          type: string
          readOnly: true
          description: 冻结金额的元字符串（后端换算，减少前端分→元误用）
        status:
          type: string
          enum: [pending, approved, rejected]
        reason:
          type: string
        reviewer_user_id:
          type: string
        review_note:
          type: string
        payment_refund_refs:
          type: array
          items:
            type: object
        reviewed_at:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
    BillingUnit:
      type: object
      properties:
        id:
          type: string
        unit_type:
          type: string
        name:
          type: string
        price_points:
          type: integer
          description: 金额，单位：分（1 元 = 100）
          format: int64
        unit:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
        updated_at:
          type: string
    BillingTransaction:
      type: object
      properties:
        id:
          type: string
        account:
          type: string
        transaction_type:
          type: string
        amount_points:
          type: integer
          format: int64
          description: 交易金额，单位：分（1 元 = 100）
        balance_before_points:
          type: integer
          format: int64
          description: 交易前余额，单位：分（1 元 = 100）
        balance_after_points:
          type: integer
          format: int64
          description: 交易后余额，单位：分（1 元 = 100）
        points_source_type:
          type: string
        billing_unit:
          description: 嵌套计费单元对象；缺失时可能省略
          $ref: '#/components/schemas/BillingUnit'
        project_id:
          type: string
        user_id:
          type: string
        user_name:
          type: string
        workspace_id:
          type: string
        task_id:
          type: string
        description:
          type: string
        transaction_id:
          type: string
        usage_amount:
          type: number
        created_at:
          type: string
        expires_at:
          type: string
          description: 充值批次有效期（来自 payment ledger；非充值流水可省略）
        points_source_type_display:
          type: string
          description: 支付/来源中文展示名（可选）
        change_display:
          type: string
          description: 变动明细文案，如「任务帖 +10 帖」或「-0.30 元」
        resource_changes:
          type: array
          description: 资源变动明细（赠送/配额等）
          items:
            type: object
            properties:
              resource_type:
                type: string
              quantity:
                type: integer
                format: int64
              remaining_after:
                type: integer
                format: int64
              label:
                type: string
              display:
                type: string
              region:
                type: string
        ledger_snapshot:
          type: object
          description: 该行瞬时账目（现金 before→after 元 + 可选资源剩余）
          properties:
            balance_before_points:
              type: integer
              description: 金额，单位：分（1 元 = 100）
              format: int64
            balance_after_points:
              type: integer
              description: 金额，单位：分（1 元 = 100）
              format: int64
            balance_before_yuan:
              type: string
            balance_after_yuan:
              type: string
            display:
              type: string
            display_lines:
              type: array
              items:
                type: string
    BillingUsage:
      type: object
      properties:
        id:
          type: string
        account:
          type: string
        billing_unit:
          $ref: '#/components/schemas/BillingUnit'
        amount:
          type: number
        project_id:
          type: string
        project_name:
          type: string
        user_id:
          type: string
        user_name:
          type: string
        workspace_id:
          type: string
        task_id:
          type: string
        description:
          type: string
        usage_time:
          type: string
    PaymentChannels:
      type: object
      properties:
        paypal_enabled:
          type: boolean
        paypal_currency:
          type: string
        wechat_enabled:
          type: boolean
        wechat_mode:
          type: string
    KycRechargeGateDenied:
      type: object
      required:
      - error
      - reason_code
      properties:
        error:
          type: string
          description: 用户可见说明（不含证件等敏感信息）
        reason_code:
          type: string
          description: KYC_TIER_BLOCKED | KYC_AMOUNT_EXCEEDS_SINGLE | KYC_AMOUNT_EXCEEDS_DAILY | KYC_AML_REVIEW | KYC_SERVICE_UNAVAILABLE
        tier:
          type: string
          description: 当前 KYC tier（如 T0_unverified）
    WechatPrepayResult:
      type: object
      properties:
        out_trade_no:
          type: string
        code_url:
          type: string
        mode:
          type: string
        amount_yuan:
          type: integer
          format: int64
        amount_points:
          type: integer
          description: 金额，单位：分（1 元 = 100）
          format: int64
    PaymentOrderStatus:
      type: object
      properties:
        status:
          type: string
          enum:
          - pending
          - completed
        order_id:
          type: string
        out_trade_no:
          type: string
        recharge_points:
          type: integer
          description: 金额，单位：分（1 元 = 100）
          format: int64
        detail:
          type: string
    InsufficientBalance:
      type: object
      properties:
        error:
          type: string
        balance_points:
          type: integer
          description: 金额，单位：分（1 元 = 100）
          format: int64
        required_points:
          type: integer
          description: 金额，单位：分（1 元 = 100）
          format: int64
    GitlabResourcesView:
      type: object
      properties:
        tenant_id:
          type: string
        disk_gb:
          type: integer
          format: int64
          description: 当前磁盘配额（GB）
        traffic_prepaid_gb:
          type: integer
          format: int64
          description: 当前流量预购（GB）
        disk_used_bytes:
          type: integer
          format: int64
          description: 已用磁盘（字节）
        disk_used_gb:
          type: number
          format: double
          description: 已用磁盘（GiB，由 disk_used_bytes 换算，三位小数）
        traffic_used_gb:
          type: number
          format: double
          description: 已用流量（GB，计量水位与扣费流水较大值；不含磁盘占用）
        traffic_download_allowed:
          type: boolean
          description: 公网 git-upload-pack 是否允许（未预购或超额为 false）
        traffic_quota_code:
          type: string
        disk_months:
          type: integer
          format: int64
        disk_expires_at:
          type: string
        gitlab_disk_unit_price_cents:
          type: integer
          format: int64
        gitlab_traffic_unit_price_cents:
          type: integer
          format: int64
        updated_at:
          type: string
    GitlabResourcesPurchaseResult:
      type: object
      properties:
        tenant_id:
          type: string
        disk_gb:
          type: integer
          format: int64
        disk_months:
          type: integer
          format: int64
        disk_expires_at:
          type: string
        traffic_prepaid_gb:
          type: integer
          format: int64
        disk_cost_points:
          type: integer
          description: 金额，单位：分（1 元 = 100）
          format: int64
        traffic_cost_points:
          type: integer
          description: 金额，单位：分（1 元 = 100）
          format: int64
        total_cost_points:
          type: integer
          description: 金额，单位：分（1 元 = 100）
          format: int64
        balance_after:
          type: integer
          format: int64
        gitlab_disk_unit_price_cents:
          type: integer
          format: int64
        gitlab_traffic_unit_price_cents:
          type: integer
          format: int64
        idempotency_key:
          type: string
    InternalAccountResponse:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/BillingAccount'
        created:
          type: boolean
        task_post_price:
          type: integer
          format: int64
        balance:
          type: integer
          format: int64
