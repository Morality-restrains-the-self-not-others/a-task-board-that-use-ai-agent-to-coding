# Internal API live smoke (post start-all / nightly soft probe)
name: Internal APIs Live Smoke

on:
  schedule:
    # 每日 03:30 北京时间 (UTC+8) = 19:30 UTC
    - cron: '30 19 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/smoke/internal-apis-live.sh'
      - 'runAll/src/internal_apis_smoke.go'
      - 'runAll/src/internal_apis_smoke_test.go'
      - '.github/workflows/internal-apis-live-smoke.yml'

concurrency:
  group: internal-apis-live-smoke
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 根仓大量 CI 步骤依赖子模块内容（db/scripts/ci/*、runAll/scripts/*、conf/）
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: runAll internal-apis smoke unit tests
        working-directory: runAll
        run: go test ./src -count=1 -run 'InternalAPIsSmoke|TraceShipping'

  live-optional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 根仓大量 CI 步骤依赖子模块内容（db/scripts/ci/*、runAll/scripts/*、conf/）
          submodules: recursive
      - name: Live smoke (optional — skip when stack down)
        env:
          INTERNAL_API_SMOKE_MODE: optional
          INTERNAL_API_SMOKE_HOST: ${{ vars.INTERNAL_API_SMOKE_HOST || '127.0.0.1' }}
        run: bash scripts/smoke/internal-apis-live.sh

  live-required-remote:
    # 仅当配置了远端全栈 HOST 时做硬校验（self-hosted / 常驻环境）
    if: ${{ vars.INTERNAL_API_SMOKE_HOST != '' && vars.INTERNAL_API_SMOKE_REQUIRE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 根仓大量 CI 步骤依赖子模块内容（db/scripts/ci/*、runAll/scripts/*、conf/）
          submodules: recursive
      - name: Live smoke (required against remote stack)
        env:
          INTERNAL_API_SMOKE_MODE: required
          INTERNAL_API_SMOKE_HOST: ${{ vars.INTERNAL_API_SMOKE_HOST }}
        run: bash scripts/smoke/internal-apis-live.sh
