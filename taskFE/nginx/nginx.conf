worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" trace_id="$http_x_trace_id"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Docker published-port DNAT 会把 $remote_addr 变成网桥网关（taskfe_default
    # 172.26.0.1）。边缘若带了 X-Forwarded-For，在此还原真实客户端。
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    server {
        # SSOT: conf/frontend/vue/config.yaml port（host network 直听宿主机端口，
        # 避免 Docker DNAT 把登录历史写成 172.26.0.1）。
        listen 4000;
        listen [::]:4000;
        server_name _;
        root /srv/taskfe/html;

        location = /health {
            default_type application/json;
            if (-f /srv/taskfe/html/index.html) {
                return 200 '{"ok":true}\n';
            }
            return 503 '{"ok":false}\n';
        }

        # Vite 生产 base=/static/assets/、assetsDir=''：文件在 release 根目录。
        # 缺失 hashed 资源必须真 404，禁止 fallback 成 index.html。
        location ^~ /static/assets/ {
            alias /srv/taskfe/html/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # api-base.js 为 vite public 资源（无内容 hash），不能吃上面 immutable 一年缓存；
        # 否则改运行时 API 配置后旧值被缓存一年（v106 安全加固：内联脚本外置）。
        location = /static/assets/api-base.js {
            alias /srv/taskfe/html/api-base.js;
            add_header Cache-Control "no-cache";
        }

        # 微信公众号域名校验：源文件 taskFE/app/static/MP_verify_*.txt（compose 挂到
        # /srv/taskfe-static）。必须独立 location：缺失时真 404，禁止 SPA fallback 成
        # index.html（微信要求正文恰好为校验码）。
        location ~ ^/MP_verify_[A-Za-z0-9]+\.txt$ {
            root /srv/taskfe-static;
            default_type text/plain;
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }

        # 本地直连 :4000 开发时 /api/ 转发到网关（OPT-20260824-004）。
        # 无此代理时 /api/* 会被上面的 SPA fallback 吞成 index.html（200 HTML），
        # referral 等接口在 dev 直连 4000 时全部静默失败；正确开发访问仍应走 :18081 网关。
        # host network：同节点 loopback 调 APISIX 已发布端口（拆分时改 ${subdomains}）。
        location /api/ {
            proxy_pass http://127.0.0.1:18081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Trace-Id $http_x_trace_id;
            proxy_read_timeout 60s;
        }
    }
}
