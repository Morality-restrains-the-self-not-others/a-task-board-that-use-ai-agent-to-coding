# runAll 编排配置 — 与 conf/<app>/ 端口一致
# 用法: cd runAll && ./build.sh && ./bin/runAll --config ../conf/runAll.yaml
# 前置: 远程 Docker（zcpu-remote context + SSH）、各前端 npm install、go 工具链
# Django saas-backend 已退役（2026-07-30），task2app/ 子模块已删除，所有 API 迁至 Go 微服务
# host / port 自动从 conf/<app>/config.yaml 读取（conf_app 映射），基础设施服务使用 ${INFRA_HOST} 占位符

version: "1"

# 是否启用代理。默认 false（不启用），所有服务启动时自动清除 HTTP_PROXY/HTTPS_PROXY/ALL_PROXY 环境变量。
# 设为 true 后，服务将继承宿主机的代理环境变量。单个服务可通过 service.use_proxy: true 单独开启。
use_proxy: false

logging:
  # 服务日志统一输出至项目根目录 logs/（绝对路径，避免 cwd 变化导致路径不一致）
  # 每服务日志路径见 conf/<app>/config.yaml → logging.log_file
  file_root: /tmp/ram-work/logs

observability:
  grafana_url: "http://${INFRA_HOST}:3000"
  loki_url: "http://${INFRA_HOST}:3100"
  trace_dashboard_uid: distributed-trace-view
  # Mac Promtail tails ../logs/ → remote Loki (bash runAll/scripts/runall-local-promtail.sh up)
  # 每服务日志路径见 conf/<app>/config.yaml → logging.log_file
  local_promtail: true

groups:
  - name: infrastructure
    services:
      - name: docker-mysql
        conf_app: infra/mysql
        start_command: "bash dockerInfra/mysql/run.sh start"
        stop_command: "bash dockerInfra/mysql/run.sh stop"
        launch_mode: detach
        working_dir: .
        health_check:
          exec: "bash dockerInfra/mysql/health.sh"
          timeout: 180
          retries: 40
          backoff:
            initial: 2.0
            max: 16.0
            multiplier: 2.0
        on_failure: exit

      - name: docker-redis
        conf_app: infra/redis
        start_command: "bash dockerInfra/redis/run.sh start"
        stop_command: "bash dockerInfra/redis/run.sh stop"
        launch_mode: detach
        working_dir: .
        health_check:
          exec: "bash dockerInfra/redis/health.sh"
          timeout: 120
          retries: 30
          backoff:
            initial: 1.0
            max: 8.0
            multiplier: 2.0
        on_failure: exit

      - name: docker-kafka
        conf_app: infra/kafka
        start_command: "bash dockerInfra/kafka/run.sh start"
        stop_command: "bash dockerInfra/kafka/run.sh stop"
        launch_mode: detach
        working_dir: .
        # Broker-first probe (compose kafka running + kafka-topics). Do NOT use Kafka UI :18080 alone —
        # UI can stay Up while broker Exited (FE-20260721-KAFKA-UI-FALSE-HEALTHY / OPT-20260721-007).
        health_check:
          exec: "bash dockerInfra/kafka/health.sh"
          timeout: 180
          retries: 40
          backoff:
            initial: 2.0
            max: 16.0
            multiplier: 2.0
        on_failure: exit

      - name: docker-portainer
        conf_app: infra/portainer
        start_command: "bash dockerInfra/portainer/run.sh start"
        stop_command: "bash dockerInfra/portainer/run.sh stop"
        launch_mode: detach
        working_dir: .
        health_check:
          url: "http://${INFRA_HOST}:9000/api/status"
          timeout: 60
          retries: 20
          backoff:
            initial: 1.0
            max: 8.0
            multiplier: 2.0
        on_failure: skip

      - name: ai-monitor
        conf_app: infra/ai-monitor
        # 镜像下载收敛到编译阶段：UI「编译」→ bash AiMonitor/run.sh pull（compose pull）。
        # 启动不再拉取镜像（--pull never），避免启动时卡在下载导致健康检查超时。
        build_command: "bash AiMonitor/run.sh pull"
        start_command: "bash AiMonitor/run.sh start"
        stop_command: "bash AiMonitor/run.sh stop"
        launch_mode: detach
        working_dir: .
        depends_on: [docker-redis]
        health_check:
          url: "http://${INFRA_HOST}:3000/api/health"
          timeout: 180
          retries: 36
          backoff:
            initial: 2.0
            max: 16.0
            multiplier: 2.0
        on_failure: skip

      # 常驻日志投递：依赖 ai-monitor（Loki）。清空可观测栈后须随 infrastructure 一并拉起，避免 Loki 空、Promtail 停。
      # 禁止用 Loki /ready 代替 Promtail 探活：Loki 就绪而容器缺失时热替换会把 promtail-local 标为 healthy，
      # Grafana Trace Log Journey 随后整盘 No data。Linux=aimonitor-promtail，Mac overlay=aimonitor-promtail-local。
      - name: promtail-local
        conf_app: infra/ai-monitor
        start_command: "bash runAll/scripts/runall-local-promtail.sh up"
        stop_command: "bash runAll/scripts/runall-local-promtail.sh down"
        launch_mode: detach
        working_dir: .
        depends_on: [ai-monitor]
        health_check:
          exec: "docker inspect -f '{{.State.Running}}' aimonitor-promtail 2>/dev/null | grep -qx true || docker inspect -f '{{.State.Running}}' aimonitor-promtail-local | grep -qx true"
          timeout: 90
          # 覆盖 Loki 全量冷启动窗口（约 4-5min）；on_failure: skip 保证不阻塞整体启动
          retries: 24
          backoff:
            initial: 2.0
            max: 12.0
            multiplier: 2.0
        on_failure: skip

  # 各区域独立 GitLab CE：现网 :8012 与上海 SH-1 :8014 分开启停，勿与 MySQL/Kafka 混组。
  # GitLab 可插拔（ADR-0014 / ADR-0048）：其它服务不得 depends_on git-service*；
  # OAuth/OIDC/计费在运行时 HTTP 对齐，启停由人工在 9999 面板处理。
  # skip_start_all：一键 start-all 不碰本机闸门/上海 SSH；面板仍可单启或按组启动。
  - name: gitlab-regions
    skip_start_all: true
    services:
      - name: git-service
        conf_app: infra/git-service
        # 本机 GitLab 默认不启动（ADR-0047）：须 conf-local/infra/git-service/config.yaml
        # 设 runAllStartEnabled: true 后，面板 / start_command 才会真正拉起容器。
        start_command: "bash gitService/run.sh start"
        stop_command: "bash gitService/run.sh stop"
        launch_mode: detach
        working_dir: .
        depends_on: [docker-redis]
        health_check:
          url: "http://${INFRA_HOST}:8012/users/sign_in"
          timeout: 900
          retries: 60
          backoff:
            initial: 3.0
            max: 30.0
            multiplier: 2.0
        on_failure: skip

      - name: git-service-tencent-sh-1
        conf_app: infra/git-service-tencent-sh-1
        # 启停在 Host sh（ssh Host=sh）；本机跑 deploy 会抢 task-container-gateway :8014
        start_command: "bash gitService/scripts/runall_ssh_sh_gitlab.sh start"
        stop_command: "bash gitService/scripts/runall_ssh_sh_gitlab.sh stop"
        launch_mode: detach
        working_dir: .
        env:
          GITSERVICE_CONF_APP: git-service-tencent-sh-1
          GITLAB_OIDC_CLIENT_ID: gitlab-git-service-tencent-sh-1
          COMPOSE_PROJECT_NAME: gitservice-tencent-sh-1
        health_check:
          # Host sh 上的独立 GitLab；禁止 http://${INFRA_HOST}:8014（本机 8014 是 task-container-gateway）
          url: "http://1.117.67.121:8014/users/sign_in"
          timeout: 900
          retries: 60
          backoff:
            initial: 3.0
            max: 30.0
            multiplier: 2.0
        on_failure: skip

  # 远端 Host sh（ssh Host=sh，1.117.67.121）上的独立组件；启停经 ssh + systemd，勿在本机跑。
  # skip_start_all：一键 start-all 不碰远端；面板仍可单启或按组启动。
  - name: host-sh
    skip_start_all: true
    services:
      - name: wechat-mp-egress
        conf_app: infra/wechat-mp-egress
        # 启停在 Host sh systemd 单元（ADR-0059）；部署走 taskAuth/scripts/deploy_wechat_mp_egress_sh.sh
        start_command: "bash taskAuth/scripts/runall_ssh_sh_wechat_mp_egress.sh start"
        stop_command: "bash taskAuth/scripts/runall_ssh_sh_wechat_mp_egress.sh stop"
        launch_mode: detach
        working_dir: .
        health_check:
          # Host sh 上的 WeChat cgi-bin egress；端口以 conf/infra/wechat-mp-egress/config.yaml port:8030 为准
          url: "http://1.117.67.121:8030/healthz"
          timeout: 30
          retries: 30
          backoff:
            initial: 3.0
            max: 30.0
            multiplier: 2.0
        on_failure: skip

  - name: platform
    services:
      - name: task-auth
        conf_app: auth/task-auth
        build_command: "./build.sh"
        start_command: "./bin/taskAuth"
        stop_command: "bash -c 'lsof -ti:8003 | xargs kill -9 2>/dev/null || true'"
        working_dir: taskAuth
        depends_on: [docker-mysql]
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: "http://${INFRA_HOST}:4317"
          OTEL_SERVICE_NAME: task-auth
        health_check:
          health_path: /api/health/
          timeout: 60
          retries: 15
        on_failure: skip

      - name: task-bill
        conf_app: billing/task-bill
        build_command: "./build.sh"
        start_command: "./bin/taskBill"
        stop_command: "bash -c 'lsof -ti:8004 | xargs kill -9 2>/dev/null || true'"
        working_dir: taskBill
        depends_on: [docker-mysql]
        health_check:
          health_path: /api/health/
          timeout: 60
          retries: 15
        on_failure: skip

      - name: task-referral
        conf_app: task-referral
        build_command: "./build.sh"
        start_command: "./bin/taskReferral"
        stop_command: "bash -c 'lsof -ti:8025 | xargs kill -9 2>/dev/null || true'"
        working_dir: taskReferral
        depends_on: [task-auth]
        health_check:
          health_path: /api/health/
          timeout: 60
          retries: 15
        on_failure: skip

      - name: task-git-oauth
        # Go taskGitOauth (formerly Django gitOauth / service name git-oauth)
        # GitLab 可插拔：运行时 HTTP 调 GitLab，不得 depends_on git-service（ADR-0048）。
        build_command: "./build.sh"
        start_command: "./bin/taskGitOauth"
        stop_command: "bash scripts/runall-stop.sh"
        working_dir: taskGitOauth
        depends_on: [docker-mysql]
        health_check:
          url: "http://${INFRA_HOST}:8002/api/health/"
          timeout: 60
          retries: 15
        on_failure: skip

      - name: ai-provider
        conf_app: ai/ai-provider
        build_command: "./build.sh"
        start_command: "./bin/taskAiProvider"
        stop_command: "bash scripts/runall-stop.sh"
        working_dir: taskAiProvider
        depends_on: [task-auth]
        health_check:
          health_path: /api/health/
          timeout: 180
          retries: 25
          backoff:
            initial: 2.0
            max: 16.0
            multiplier: 2.0
        on_failure: skip
      # saas-backend (Django) 已于 2026-07-30 正式退役 — 全部 API 迁至 Go 微服务
      # task2app/ 子模块已删除，清理记录如下：
      #   Phase 1: deprecation notices → Go services
      #   Phase 2: SSE realtime/dispatch → taskEvents (Kafka → Redis pub/sub → taskSSE)
      #   Phase 3: Internal APIs → taskAuth/taskCloudService/taskProjectService
      #   Phase 4: Cloud platform → taskCloudService
      #   Phase 5: Billing bridge → taskBill (APISIX direct)
      #   Phase 6: System admin → taskAuth/taskCloudService/taskBill
      #   Phase 7: Core domain (accounts/projects/todo) → respective Go services
      #   Phase 8: Retirement formalized — runAll saas-backend Block Removed
      #     liveness_path: /api/live/
      #     timeout: 180
      #     retries: 35
      #     backoff:
      #       initial: 2.0
      #       max: 16.0
      #       multiplier: 2.0
      #   on_failure: skip

      - name: task-gateway
        conf_app: gateway/task-gateway
        start_command: "bash run.sh start"
        stop_command: "bash run.sh stop"
        working_dir: taskGateway
        depends_on: [task-auth, task-git-oauth]
        health_check:
          health_path: /api/health/
          # compose recreate 后 APISIX init_worker 可超过 90s（实测 ~140s）
          timeout: 180
          retries: 30
        on_failure: skip

      - name: task-agent-support
        conf_app: ai/task-agent-support
        build_command: "./build.sh"
        start_command: "./bin/taskAgentSupport"
        stop_command: "bash -c 'lsof -ti:8011 | xargs kill -9 2>/dev/null || true'"
        working_dir: taskAgentSupport
        depends_on: []
        health_check:
          health_path: /api/health/
          timeout: 60
          retries: 15
        on_failure: skip

      - name: task-ai-endpoint
        conf_app: ai/task-ai-endpoint
        build_command: "./build.sh"
        start_command: "./bin/taskAIEndPoint"
        stop_command: "bash -c 'lsof -ti:8013 | xargs kill -9 2>/dev/null || true'"
        working_dir: taskAIEndPoint
        depends_on: []
        health_check:
          health_path: /api/health/
          timeout: 60
          retries: 15
        on_failure: skip

      - name: task-container-gateway
        conf_app: gateway/task-container-gateway
        build_command: "./build.sh"
        start_command: "./bin/taskContainerGateway"
        stop_command: "bash -c 'lsof -ti:8014 | xargs kill -9 2>/dev/null || true'"
        working_dir: taskContainerGateway
        depends_on: []
        health_check:
          health_path: /api/health/
          timeout: 60
          retries: 15
        on_failure: skip

      - name: task-project-service
        conf_app: taskProjectService
        build_command: "./build.sh"
        start_command: "./bin/taskProjectService"
        stop_command: "bash -c 'lsof -ti:8016 | xargs kill -9 2>/dev/null || true'"
        working_dir: taskProjectService
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: "http://${INFRA_HOST}:4317"
          OTEL_SERVICE_NAME: task-project-service
          # Git OAuth 换票桥接密钥：与 conf/core/sso/config.yaml ssoJwtSecret /
          # conf/auth/git-oauth/django.yaml 同源（OPT-20260807-071）。不注入时兜底 dev
          # 密钥与 taskGitOauth 兜底不一致 → access-for-user 401 → token_error。
          TASK2APP_SSO_JWT_SECRET: ""
        depends_on: [task-auth]
        health_check:
          health_path: /api/health
          timeout: 60
          retries: 15
        on_failure: skip

      - name: task-tenant-service
        conf_app: taskTenantService
        build_command: "./build.sh"
        start_command: "./bin/taskTenantService"
        stop_command: "bash -c 'lsof -ti:8020 | xargs kill -9 2>/dev/null || true'"
        working_dir: taskTenantService
        depends_on: [task-auth, task-project-service]
        health_check:
          health_path: /api/health
          timeout: 60
          retries: 15
        on_failure: skip

      - name: task-task-service
        conf_app: taskTaskService
        build_command: "./build.sh"
        start_command: "./bin/taskTaskService"
        stop_command: "bash -c 'lsof -ti:8017 | xargs kill -9 2>/dev/null || true'"
        working_dir: taskTaskService
        depends_on: [task-project-service, task-auth, task-bill]
        health_check:
          health_path: /api/health
          timeout: 60
          retries: 15
        on_failure: skip

      - name: task-cloud-service
        conf_app: taskCloudService
        build_command: "./build.sh"
        start_command: "./bin/taskCloudService"
        stop_command: "bash -c 'lsof -ti:8018 | xargs kill -9 2>/dev/null || true'"
        working_dir: taskCloudService
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: "http://${INFRA_HOST}:4317"
          OTEL_SERVICE_NAME: task-cloud-service
          # 本地 prepare 换票须直连 loopback gitOauth；勿用公网 gitoauth（nginx 502 / 缺 bridge）
          GITOAUTH_BASE_URL: "http://${INFRA_HOST}:8002"
          # SaaS 出口 IP：白名单安全组须放行，否则 container-layer-graph / heartbeat 探针会 timeout
          TASK2APP_SG_EXTRA_INGRESS_CIDRS: "183.250.1.132/32"
        depends_on: [task-project-service, task-task-service, task-auth, task-git-oauth]
        health_check:
          health_path: /api/health
          timeout: 60
          retries: 15
        on_failure: skip

      - name: task-sse
        conf_app: gateway/task-sse
        start_command: "bash run.sh start"
        stop_command: "bash run.sh stop"
        working_dir: taskSSE
        depends_on: [docker-redis]
        health_check:
          health_path: /health
          timeout: 60
          retries: 15
        on_failure: skip

      - name: task-credential-service
        conf_app: container/task-credential-service
        build_command: "./build.sh"
        start_command: "./bin/taskCredentialService"
        stop_command: "bash -c 'lsof -ti:8015 | xargs kill -9 2>/dev/null || true'"
        working_dir: taskCredentialService
        depends_on: [task-git-oauth, task-task-service]
        health_check:
          health_path: /health
          timeout: 30
          retries: 10
        on_failure: skip

      - name: task-ai-comment
        conf_app: taskAIComment
        build_command: "./build.sh"
        start_command: "./bin/taskAIComment"
        stop_command: "bash -c 'lsof -ti:8019 | xargs kill -9 2>/dev/null || true'"
        working_dir: taskAIComment
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: "http://${INFRA_HOST}:4317"
          OTEL_SERVICE_NAME: task-ai-comment
        depends_on:
          - task-auth
          - task-task-service
          - task-sse
          - task-cloud-service
          - task-credential-service
          - docker-kafka
        health_check:
          health_path: /api/health
          timeout: 60
          retries: 15
        on_failure: skip

      - name: taskFE
        conf_app: frontend/vue
        build_command: "bash scripts/runall-lifecycle.sh build"
        start_command: "bash scripts/runall-lifecycle.sh start"
        stop_command: "bash scripts/runall-lifecycle.sh stop"
        # OPT-20260820-004：静态 nginx 常驻，精准重启时跳过 compose stop（保持在线，
        # build 只切 public/html symlink），复用容器健康检查；nginx.conf 变更经 reload 生效。
        skip_stop_on_restart: true
        restart_reload_command: "docker exec taskfe-nginx nginx -s reload"
        working_dir: taskFE/app
        launch_mode: detach
        depends_on: [task-gateway]
        health_check:
          health_path: /health
          timeout: 90
          retries: 20
        on_failure: skip

  - name: domain-events-intents
