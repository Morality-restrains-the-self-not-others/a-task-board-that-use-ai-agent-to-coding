# 基础设施服务地址。默认 10.2.150.68（生产内网 IP）；本地开发时设置 INFRA_HOST=127.0.0.1。
# 参见 .ai/01_project_constraints/39_network_topology_aware_config.md
# Browser-reachable infrastructure host for ${INFRA_HOST} (Grafana CORS Origin 等).
# Override with env INFRA_HOST when the LAN/public IP changes.
infraHost: ${INFRA_HOST:-10.2.150.68}
redis:
  host: ${INFRA_HOST:-10.2.150.68}
  port: 6379
kafka:
  host: ${INFRA_HOST:-10.2.150.68}
  bootstrapServers: ${INFRA_HOST:-10.2.150.68}:9093
  kafkaUiPort: 18080
