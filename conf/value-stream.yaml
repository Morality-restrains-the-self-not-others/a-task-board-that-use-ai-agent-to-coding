  - name: token-init-calls-go
    status: active
    test_file: tests/test_relay_to_trae_proxy.py
    fields:
    - name: task-credential-service.credential_container_tokens.container_access_token
      description: Go IssueToken 签发，Django 不再写入（relayToTrae 路径）
    - name: task-credential-service.credential_container_tokens.container_access_token_expires_at
    - name: task-credential-service.credential_container_tokens.container_refresh_token
  - name: precheck-two-phase-go
    status: active
    test_file: tests/test_relay_to_trae_proxy.py
    fields:
    - name: task-credential-service.credential_container_tokens.container_access_token
      description: precheck 先调 /v1/token/init/tenant/{tid}/workspace/{wid}/task/{tk} 再调 repo-clone-credentials，同一 token 复用
  - name: start-calls-go-token-init
    status: active
    test_file: tests/test_relay_to_trae_proxy.py
    fields:
    - name: task-credential-service.credential_container_tokens.container_access_token
      description: start 调 /v1/token/init/tenant/{tid}/workspace/{wid}/task/{tk} 替代 Django 自生成，注入 runtime_env 发给 go_relayToTrae
  - name: remove-dual-write-hack
    status: active
    test_file: tests/test_relay_to_trae_proxy.py
    fields:
    - name: task-cloud-service.cloud_cloudserverconfig.container_access_token
      description: relayToTrae 路径停止写入；_sync_token_to_credential_service / _sync_credential_service_token / _issue_relay_access_token 删除
