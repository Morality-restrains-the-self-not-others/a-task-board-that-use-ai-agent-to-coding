version: '1'
runall_config: runAll.yaml
runner:
  working_dir: ../task2app/Saas_project
  pytest_bin: pytest
  env:
    DJANGO_SETTINGS_MODULE: saas_project.settings_test
  pytest_args: []
value_streams:
- name: user-auth
  domain: 用户与认证
  description: 用户注册与认证
  steps:
  - name: email-register
    status: active
    test_file: accounts/view_test/UserViewSet_email_register_test.py
    fields:
    - name: task-auth.auth_user.id
      description: 注册后业务 user_id 引用 auth.db 雪花 ID
    - name: task-auth.auth_login_method.identifier
      description: taskAuth 邮箱登录标识
    - name: task-auth.auth_login_method.password_hash
      description: 注册密码哈希（auth.db）
  - name: phone-register
    status: active
    test_file: accounts/view_test/UserViewSet_phone_register_test.py
    fields:
    - name: task-auth.auth_user.id
      description: 手机注册后 auth.db 雪花 ID
    - name: task-auth.auth_login_method.identifier
      description: 手机注册 identifier（国内号码）
    - name: task-auth.auth_login_method.phone_country_calling_code
      description: 手机国号
    - name: task-auth.auth_customtoken.key
      description: 注册后签发 token
    - name: task-auth.auth_login_method.password_hash
      description: 手机注册密码哈希
  - name: privileged-phone-multi-bind
    status: active
    test_file: ../../taskAuth/src/auth_phone_bind_test.go
    fields:
    - name: task-auth.auth_login_method.identifier
      description: 特权角色共享绑定的国内号码
    - name: task-auth.auth_login_method.phone_country_calling_code
      description: 共享绑定国号
    - name: task-auth.auth_user.is_staff
      description: 员工标志（可共享手机）
    - name: task-auth.auth_user.is_tester
      description: 测试标志（可共享手机）
    - name: task-auth.auth_user.is_superuser
      description: 超级用户标志（可共享手机）
  - name: password-policy
    status: active
    test_file: accounts/tests/test_password_policy.py
    fields:
    - name: task-auth.auth_login_method.password_hash
      description: 密码策略校验 auth.db 哈希
  - name: activate
    status: active
    test_file: accounts/view_test/UserViewSet_activate_test.py
    fields:
    - name: task-auth.auth_login_method.is_verified
      description: 激活后 auth.db 登录方式已验证
    - name: task-auth.auth_login_method.activation_token
      description: taskAuth 激活令牌读写
  - name: login
    status: active
    test_file: accounts/view_test/UserViewSet_login_test.py
    fields:
    - name: task-auth.auth_user.id
      description: enrich-login 读 auth.db user_id
    - name: task-auth.auth_customtoken.key
      description: taskAuth 签发 token（auth.db）
    - name: task-auth.auth_login_method.identifier
      description: taskAuth 凭证校验
    - name: task-auth.auth_login_method.password_hash
      description: 密码登录哈希校验
  - name: login-history-record
    status: active
    test_file: ../../taskAuth/src/login_history_handlers_test.go
    fields:
    - name: task-auth.auth_login_history.user_id
      description: 成功登录写入的用户 ID
    - name: task-auth.auth_login_history.client_ip
      description: resolveClientIP 记录的客户端 IP
    - name: task-auth.auth_login_history.entry
      description: customer/admin 等入口枚举
  - name: login-history-profile
    status: active
    test_file: ../../taskFE/app/src/views/UserLoginHistory.test.js
    fields:
    - name: task-auth.auth_login_history.client_ip
      description: 账号中心侧边栏展示的登录 IP
  - name: admin-impersonate-start
    status: active
    test_file: ../../taskAuth/src/handlers_impersonation_test.go
    fields:
    - name: task-auth.auth_impersonation_session.id
      description: 模拟会话 Snowflake id
    - name: task-auth.auth_impersonation_session.token_key
      description: 独立模拟 token（imp_ 前缀）
    - name: task-auth.auth_impersonation_session.actor_user_id
      description: 操作者 user id
    - name: task-auth.auth_impersonation_session.target_user_id
      description: 被模拟 user id
  - name: admin-impersonate-stop
    status: active
    test_file: ../../taskAuth/src/handlers_impersonation_test.go
    fields:
    - name: task-auth.auth_impersonation_session.ended_at
      description: 模拟会话结束时间
  - name: frontend-auth-guard-redirect
    status: active
    test_file: ../../taskFE/app/src/tests/domain/auth/auth_domain_model.test.js
    fields:
    - name: task-auth.auth_user.id
      description: profile 会话校验真源（auth.db / token）
  - name: reset-password
    status: active
    test_file: accounts/view_test/UserViewSet_reset_password_test.py
    fields:
    - name: task-auth.auth_login_method.identifier
      description: 邮箱/手机登录标识（重置目标）；Playwright E2E playwrig../../taskFE/tests/AuthResetPassword.full-flow.playwright.test.js（需
        PW_RESET_EMAIL）
    - name: task-auth.auth_login_method.password_reset_token
      description: Go 生成重置令牌（auth.db）
    - name: task-auth.auth_login_method.password_hash
      description: 链接/验证码重置后新密码哈希
  - name: resend-activation
    status: active
    test_file: accounts/view_test/UserViewSet_resend_activation_email_test.py
    fields:
    - name: task-auth.auth_login_method.identifier
      description: 重发目标邮箱
    - name: task-auth.auth_login_method.activation_token
      description: taskAuth 重发激活时刷新令牌
  - name: phone-otp-login
    status: active
    test_file: tests/test_login_phone_code.py
    fields:
    - name: task-auth.auth_user.id
      description: forward-login 后 auth.db user_id
    - name: task-auth.auth_login_method.identifier
      description: 手机号登录标识（auth.db）
    - name: task-auth.auth_customtoken.key
      description: taskAuth proxyToDjangoAuth 在 auth.db 签发 token（saas forward_login
        不写 token）
  - name: login-phone-otp-ui-next-redirect
    status: active
    test_file: ../../taskFE/app/src/utils/resolvePostLoginRedirect.test.js
    fields:
    - name: saas-backend.auth_system_feature_policy.enable_phone_login
      description: 登录页展示手机验证码入口门禁；0060 migration 打开现网 global
    - name: task-auth.auth_customtoken.key
      description: 登录成功后 persistLoginAccountSlot 写入本机槽
  - name: forward-login-authdb-token
    status: planned
    test_file: tests/test_forward_login_token_in_auth_db.py
    fields:
    - name: task-auth.auth_customtoken.key
      description: OTP 路径 token 仅写 auth.db
    - name: task-auth.auth_user.id
      description: forward-login 返回 user_id 供 taskAuth 建 token
  - name: http-only-identity-client
    status: active
    test_file: tests/test_taskauth_identity_client_http.py
    fields:
    - name: task-auth.auth_user.id
      description: GET /api/accounts/users/{id}/ internal secret
    - name: task-auth.auth_user.is_active
      description: 会话与业务门禁
  - name: no-user-objects-guard
    status: active
    test_file: scripts/ci/check_no_user_objects.sh
    fields:
    - name: saas-backend.runtime.lifecycle_status
      description: CI 禁止生产路径 User.objects
  - name: identity-service-unavailable-503
    status: active
    test_file: tests/test_identity_service_unavailable_503.py
    fields:
    - name: saas-backend.runtime.lifecycle_status
      description: taskAuth 不可达时 API 返回 503
  - name: no-custom-token-guard
    status: active
    test_file: scripts/ci/check_no_custom_token_in_saas.sh
    fields:
    - name: saas-backend.runtime.lifecycle_status
      description: 全路径禁止 CustomToken.objects
  - name: no-filter-user-kwarg-guard
    status: active
    test_file: scripts/ci/check_no_filter_user_kwarg.sh
    fields:
    - name: saas-backend.auth_companymember.user_id
      description: 生产查询显式 user_id
  - name: test-principal-factory
    status: active
    test_file: tests/factories/principal.py
    fields:
    - name: task-auth.auth_user.id
      description: 测试经 create_test_user 构造 user_id
  - name: verification-code
    status: active
    test_file: tests/test_verification_code_service.py
    fields:
    - name: saas-backend.auth_sms_verification_code.code
      description: 验证码仍存 default
    - name: task-auth.auth_user.id
      description: taskAuth delegate 发送验证码 HTTP 入口
  - name: verification-code-delegate
    status: active
    test_file: tests/test_taskauth_verification_code_bridge.py
    fields:
    - name: task-auth.auth_user.id
      description: TASKAUTH_ENABLED 时 delegate 至 taskAuth
  - name: no-saas-accounts-user-table
    status: active
    test_file: tests/test_no_saas_accounts_user_table.py
    fields:
    - name: task-auth.auth_user.id
      description: 用户身份真源在 auth.db
    - name: task-auth.auth_login_method.id
      description: login_method 仅存 auth.db
    - name: task-auth.auth_customtoken.key
      description: token 仅存 auth.db
  - name: taskauth-bridge-regression
    status: active
    test_file: tests/test_taskauth_password_reset_bridge.py
    fields:
    - name: task-auth.auth_login_method.password_reset_token
      description: 桥接回归覆盖密码重置 delegate
    - name: task-auth.auth_customtoken.key
      description: 桥接路径 token 路由至 auth.db
  - name: multi-account-activate-session
    status: active
    test_file: ../../taskAuth/src/auth_activate_session_test.go
    fields:
    - name: task-auth.auth_customtoken.key
      description: 切换目标账号 Token（activate-session 校验）
    - name: task-auth.auth_user.id
      description: Token 解析出的用户 ID
  - name: multi-account-navbar-switch
    status: active
    test_file: ../../taskFE/app/src/tests/domain/auth/saved_accounts_store.test.js
    fields:
    - name: task-auth.auth_user.id
      description: 激活账号 userId 写入 cookie / 多账号槽
  - name: runall-task-auth-orchestration
    status: active
    test_file: tests/test_taskauth_phone_register_bridge.py
    fields:
    - name: task-auth.runtime.lifecycle_status
      description: runAll.yaml 编排 task-auth :8003 health
    - name: saas-backend.runtime.lifecycle_status
      description: saas-backend 依赖 task-auth 且 TASKAUTH_ENABLED=true
  - name: user-activation-event
    status: active
    test_file: tests/test_user_activation_welcome_event.py
    fields:
    - name: task-auth.auth_login_method.is_verified
      description: 激活事件触发时 auth.db 已验证
  - name: profile-phone-replace
    status: active
    test_file: tests/test_profile_phone_replace.py
    fields:
    - name: task-auth.auth_login_method.identifier
      description: 手机号绑定读 auth.db（router）
    - name: task-auth.auth_user.id
      description: 资料页 user_id（无 saas User 表）
  - name: gateway-forward-auth-token-resolve
    status: active
    test_file: tests/test_domain_events_port_config.py
    fields:
    - name: task-auth.auth_customtoken.key
      description: 网关 forward-auth 解析 token（auth.db），注入 X-User-Id 头；enrich_login 同步
        token 至本地 DB
    - name: task-auth.auth_user.id
      description: forward-auth 返回 user_id 供后端信任（含 userId cookie fallback via resolveTokenUserIDFromRequest）
    - name: task-auth.auth_user.is_active
      description: forward-auth 校验用户激活状态
    - name: task-auth.runtime.cookie_bridge_enabled
      description: userId cookie 作为第4认证回退方式，统一用于 OIDC authorize 与网关 forward-auth
    - name: saas-backend.runtime.lifecycle_status
      description: Django TASK_GATEWAY_TRUST_HEADERS 信任网关头短路认证
  - name: username-upsert
    status: planned
    test_file: tests/test_domain_events_port_config.py
    fields:
    - name: task-auth.auth_login_method.id
      description: username/phone upsert 雪花ID（auth.db显式生成）；Go测试TestUsernameTakenAndUpsertLoginMethod
    - name: task-auth.auth_login_method.identifier
      description: username登录标识（upsert幂等）
    - name: task-auth.auth_login_method.method_type
      description: username类型（phone已有phone-register步骤覆盖）
