provider: gitlab
service_provider: tencent-sh-1
target:
  website: ${scheme}://${subdomains.gitlabTencentSh1}
  client_id: ''
  client_secret: ""
  # 与 conf/auth/git-oauth/providers/http-gitlab-tencent-sh-1.yaml 保持一致（仅模板引用）。
  # v2 回调契约：base 域 /redirect/gitsite/<gitsite>/oauth/callback/。
  redirect_uri: ${scheme}://${subdomains.base}/redirect/gitsite/${subdomains.gitlabTencentSh1}/oauth/callback/
  # git-over-HTTP push 需要 write_repository；api 只管 REST，不含 git push。
  scope: read_repository write_repository api read_user
service:
  allowedHost: ${scheme}://${subdomains.base}
  # gitoauth_base：taskProjectService 换票桥接内网地址（见 OPT-20260807-071）。
  gitoauth_base: http://127.0.0.1:8002
  host: 0.0.0.0
  port: 8002
